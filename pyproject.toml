[project]
name = "swap-skins"
version = "1.0.0"
description = "Mineração de dados do mercado de skins de CS2 e modelo de preço justo para a plataforma SWAP SKINS"
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "tabulate>=0.10.0",
]
